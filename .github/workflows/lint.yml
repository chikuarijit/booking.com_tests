name: Python Lint

on:
  push:
    branches:
      - master
      - main
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run Flake8
      run: |
        # Check all Python files in the repository
        flake8 my_ui_booking tests --max-line-length=120 --count --statistics
